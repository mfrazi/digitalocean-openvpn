---
# =============================================================================
# Global Variables - customize these before running playbooks
# =============================================================================

# Server domain/hostname for client configs.
# If left empty, the server's public IP will be used.
# Example: "vpn.example.com"
openvpn_server_domain: ""

# OpenVPN network settings
openvpn_server_network: "10.8.0.0"
openvpn_server_netmask: "255.255.255.0"
openvpn_server_network_cidr: "10.8.0.0/24"

# OpenVPN port and protocol
openvpn_port: 1194
openvpn_proto: "udp"

# Enable TCP listener in addition to UDP
openvpn_enable_tcp: false
openvpn_port_tcp: 443

# DNS servers pushed to clients
openvpn_dns_servers:
  - "1.1.1.1"
  - "1.0.0.1"

# Cipher and TLS settings
openvpn_cipher: "AES-256-GCM"
openvpn_auth_digest: "SHA256"
openvpn_tls_version_min: "1.2"

# Certificate validity (in days)
openvpn_ca_expire: 3650       # CA: 10 years
openvpn_cert_expire: 1080     # Server/Client certs: 3 years
openvpn_crl_days: 3650

# EasyRSA version to use
easyrsa_version: "3.1.7"
easyrsa_install_dir: "/opt/easy-rsa"

# OpenVPN directories
openvpn_dir: "/etc/openvpn"
openvpn_server_dir: "/etc/openvpn/server"
openvpn_pki_dir: "/etc/openvpn/easy-rsa"
openvpn_clients_dir: "/etc/openvpn/clients"

# Local directory to download client configs to
openvpn_local_clients_dir: "{{ playbook_dir }}/../clients"

# Whether to redirect all client traffic through VPN (full tunnel)
openvpn_redirect_gateway: true

# Maximum number of concurrent clients
openvpn_max_clients: 100

# Keep-alive settings
openvpn_keepalive_interval: 10
openvpn_keepalive_timeout: 120

# Log verbosity (0-9, default 3)
openvpn_verb: 3

# Server key size for DH parameters
openvpn_dh_keysize: 2048
