---
# =============================================================================
# Main Setup Playbook
# Configures a fresh Ubuntu server as a fully operational OpenVPN server.
#
# Usage:
#   ansible-playbook setup.yml
#   ansible-playbook setup.yml --extra-vars "openvpn_server_domain=vpn.example.com"
# =============================================================================

- name: Wait for server to be reachable
  hosts: openvpn_servers
  gather_facts: false
  tasks:
    - name: Wait for SSH to be available
      wait_for_connection:
        delay: 10
        timeout: 300
      tags: [always]

- name: Configure OpenVPN Server
  hosts: openvpn_servers
  become: true
  gather_facts: true

  pre_tasks:
    - name: Display server information
      debug:
        msg:
          - "Setting up OpenVPN on: {{ ansible_host }}"
          - "OS: {{ ansible_distribution }} {{ ansible_distribution_version }}"
          - "Domain/IP: {{ openvpn_server_domain if (openvpn_server_domain is defined and openvpn_server_domain | length > 0) else ansible_host }}"

    - name: Ensure we are running on Ubuntu
      fail:
        msg: "This playbook requires Ubuntu. Found: {{ ansible_distribution }}"
      when: ansible_distribution != "Ubuntu"

  roles:
    - role: openvpn_server
      tags: [openvpn, server]

  post_tasks:
    - name: OpenVPN server setup complete
      debug:
        msg:
          - "=========================================="
          - " OpenVPN Server Setup Complete!"
          - "=========================================="
          - " Server: {{ ansible_host }}"
          - " Port: {{ openvpn_port }}/{{ openvpn_proto }}"
          - " VPN Network: {{ openvpn_server_network }}/24"
          - ""
          - " Next steps:"
          - " 1. Create a client:  make add-client CLIENT=mydevice"
          - "    or:               ./scripts/add-client.sh mydevice"
          - " 2. Import the .ovpn file from the 'clients/' directory"
          - "=========================================="
