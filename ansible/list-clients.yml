---
# =============================================================================
# List OpenVPN Clients Playbook
# Lists all current client certificates, their status (valid/revoked/expired).
#
# Usage:
#   ansible-playbook list-clients.yml
# =============================================================================

- name: List OpenVPN Clients
  hosts: openvpn_servers
  become: true
  gather_facts: false

  tasks:
    - name: Get list of issued certificates
      find:
        paths: "{{ easyrsa_install_dir }}/pki/issued"
        patterns: "*.crt"
        excludes: "server.crt"
      register: issued_certs

    - name: Get list of revoked certificates
      command: "openssl crl -in {{ openvpn_server_dir }}/crl.pem -noout -text"
      register: crl_content
      changed_when: false
      failed_when: false

    - name: Check certificate validity for each client
      command: "openssl x509 -in {{ item.path }} -noout -enddate -subject"
      register: cert_details
      changed_when: false
      loop: "{{ issued_certs.files }}"
      loop_control:
        label: "{{ item.path | basename }}"

    - name: Display client list
      debug:
        msg:
          - "=========================================="
          - " OpenVPN Clients ({{ issued_certs.files | length }} total)"
          - "=========================================="
          - "{{ cert_details.results | map(attribute='stdout') | list | join('\n') }}"
          - "=========================================="
