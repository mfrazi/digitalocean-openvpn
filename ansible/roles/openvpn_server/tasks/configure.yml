---
- name: Determine server address (use domain or IP)
  set_fact:
    openvpn_server_address: >-
      {{
        openvpn_server_domain
        if (openvpn_server_domain is defined and openvpn_server_domain | length > 0)
        else ansible_host
      }}

- name: Deploy OpenVPN server configuration
  template:
    src: server.conf.j2
    dest: "{{ openvpn_server_dir }}/server.conf"
    mode: "0644"
    backup: yes
  notify: restart openvpn

- name: Enable IP forwarding
  sysctl:
    name: net.ipv4.ip_forward
    value: "1"
    sysctl_set: yes
    state: present
    reload: yes

- name: Enable IPv6 forwarding (optional)
  sysctl:
    name: net.ipv6.conf.all.forwarding
    value: "1"
    sysctl_set: yes
    state: present
    reload: yes
  ignore_errors: yes

- name: Persist sysctl settings
  template:
    src: sysctl-openvpn.conf.j2
    dest: /etc/sysctl.d/99-openvpn.conf
    mode: "0644"

- name: Enable and start OpenVPN server service
  systemd:
    name: "openvpn-server@server"
    state: started
    enabled: yes
    daemon_reload: yes

- name: Wait for OpenVPN to start
  wait_for:
    port: "{{ openvpn_port }}"
    protocol: "{{ openvpn_proto }}"
    timeout: 30
  ignore_errors: yes

- name: Check OpenVPN service status
  command: systemctl status openvpn-server@server
  register: openvpn_status
  changed_when: false
  failed_when: false

- name: Display OpenVPN service status
  debug:
    msg: "{{ openvpn_status.stdout_lines }}"
