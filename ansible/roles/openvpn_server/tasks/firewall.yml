---
- name: Get default network interface
  command: ip route show default
  register: default_route
  changed_when: false

- name: Extract default interface name
  set_fact:
    default_interface: "{{ default_route.stdout | regex_search('dev (\\S+)', '\\1') | first }}"

- name: Configure UFW default policies
  ufw:
    default: "{{ item.policy }}"
    direction: "{{ item.direction }}"
  loop:
    - { policy: "deny", direction: "incoming" }
    - { policy: "allow", direction: "outgoing" }
    - { policy: "allow", direction: "routed" }

- name: Allow SSH through firewall
  ufw:
    rule: allow
    port: "22"
    proto: tcp

- name: Allow OpenVPN UDP through firewall
  ufw:
    rule: allow
    port: "{{ openvpn_port | string }}"
    proto: udp

- name: Allow OpenVPN TCP through firewall
  ufw:
    rule: allow
    port: "{{ openvpn_port_tcp | string }}"
    proto: tcp
  when: openvpn_enable_tcp | default(false)

- name: Configure UFW before.rules for NAT masquerade
  blockinfile:
    path: /etc/ufw/before.rules
    insertbefore: "^# Don't delete these required lines"
    block: |
      # OpenVPN NAT masquerade
      *nat
      :POSTROUTING ACCEPT [0:0]
      -A POSTROUTING -s {{ openvpn_server_network }}/24 -o {{ default_interface }} -j MASQUERADE
      COMMIT
    marker: "# {mark} ANSIBLE MANAGED BLOCK - OpenVPN NAT"
  notify: restart ufw

- name: Enable UFW with logging
  ufw:
    state: enabled
    logging: "low"
