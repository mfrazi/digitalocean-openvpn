---
- name: Validate client_name is provided
  fail:
    msg: "You must provide 'client_name' via --extra-vars. Example: --extra-vars 'client_name=mydevice'"
  when: client_name is not defined or client_name | length == 0

- name: Set client name fact
  set_fact:
    openvpn_client_name: "{{ client_name }}"

- name: Check if client certificate exists
  stat:
    path: "{{ easyrsa_install_dir }}/pki/issued/{{ openvpn_client_name }}.crt"
  register: client_cert_exists

- name: Fail if client does not exist
  fail:
    msg: "Client '{{ openvpn_client_name }}' not found. Cannot revoke."
  when: not client_cert_exists.stat.exists

- name: Revoke client certificate
  command:
    cmd: "{{ easyrsa_install_dir }}/easyrsa --batch revoke {{ openvpn_client_name }}"
    chdir: "{{ easyrsa_install_dir }}"
  environment:
    EASYRSA_PKI: "{{ easyrsa_install_dir }}/pki"

- name: Regenerate CRL after revocation
  command:
    cmd: "{{ easyrsa_install_dir }}/easyrsa --batch gen-crl"
    chdir: "{{ easyrsa_install_dir }}"
  environment:
    EASYRSA_PKI: "{{ easyrsa_install_dir }}/pki"

- name: Update CRL in OpenVPN server directory
  copy:
    src: "{{ easyrsa_install_dir }}/pki/crl.pem"
    dest: "{{ openvpn_server_dir }}/crl.pem"
    remote_src: yes
    mode: "0644"

- name: Remove client config from server
  file:
    path: "{{ openvpn_clients_dir }}/{{ openvpn_client_name }}"
    state: absent

- name: Reload OpenVPN to apply CRL
  systemd:
    name: "openvpn-server@server"
    state: reloaded

- name: Confirm revocation
  debug:
    msg: "Client '{{ openvpn_client_name }}' has been revoked. The CRL has been updated and OpenVPN reloaded."
