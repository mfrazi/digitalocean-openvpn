---
- name: Validate client_name is provided
  fail:
    msg: "You must provide 'client_name' via --extra-vars. Example: --extra-vars 'client_name=mydevice'"
  when: client_name is not defined or client_name | length == 0

- name: Set client name fact
  set_fact:
    openvpn_client_name: "{{ client_name }}"

- name: Check if client certificate already exists
  stat:
    path: "{{ easyrsa_install_dir }}/pki/issued/{{ openvpn_client_name }}.crt"
  register: client_cert_exists

- name: Warn if client already exists
  debug:
    msg: "WARNING: Client '{{ openvpn_client_name }}' already exists. Skipping certificate generation."
  when: client_cert_exists.stat.exists

- name: Generate client certificate request
  command:
    cmd: "{{ easyrsa_install_dir }}/easyrsa --batch gen-req {{ openvpn_client_name }} nopass"
    chdir: "{{ easyrsa_install_dir }}"
  when: not client_cert_exists.stat.exists
  environment:
    EASYRSA_PKI: "{{ easyrsa_install_dir }}/pki"
    EASYRSA_REQ_CN: "{{ openvpn_client_name }}"
    EASYRSA_CERT_EXPIRE: "{{ openvpn_cert_expire }}"

- name: Sign client certificate
  command:
    cmd: "{{ easyrsa_install_dir }}/easyrsa --batch sign-req client {{ openvpn_client_name }}"
    chdir: "{{ easyrsa_install_dir }}"
  when: not client_cert_exists.stat.exists
  environment:
    EASYRSA_PKI: "{{ easyrsa_install_dir }}/pki"

- name: Ensure local clients directory exists on server
  file:
    path: "{{ openvpn_clients_dir }}/{{ openvpn_client_name }}"
    state: directory
    mode: "0700"

- name: Determine server address
  set_fact:
    openvpn_server_address: >-
      {{
        openvpn_server_domain
        if (openvpn_server_domain is defined and openvpn_server_domain | length > 0)
        else ansible_host
      }}

- name: Read CA certificate
  slurp:
    src: "{{ openvpn_server_dir }}/ca.crt"
  register: ca_cert_content

- name: Read client certificate
  slurp:
    src: "{{ easyrsa_install_dir }}/pki/issued/{{ openvpn_client_name }}.crt"
  register: client_cert_content

- name: Read client key
  slurp:
    src: "{{ easyrsa_install_dir }}/pki/private/{{ openvpn_client_name }}.key"
  register: client_key_content

- name: Read TLS crypt key
  slurp:
    src: "{{ openvpn_server_dir }}/ta.key"
  register: ta_key_content

- name: Generate client .ovpn configuration
  template:
    src: client.ovpn.j2
    dest: "{{ openvpn_clients_dir }}/{{ openvpn_client_name }}/{{ openvpn_client_name }}.ovpn"
    mode: "0600"

- name: Ensure local clients directory exists on control machine
  file:
    path: "{{ openvpn_local_clients_dir }}/{{ openvpn_client_name }}"
    state: directory
    mode: "0700"
  delegate_to: localhost
  become: false

- name: Download client .ovpn config to local machine
  fetch:
    src: "{{ openvpn_clients_dir }}/{{ openvpn_client_name }}/{{ openvpn_client_name }}.ovpn"
    dest: "{{ openvpn_local_clients_dir }}/{{ openvpn_client_name }}/{{ openvpn_client_name }}.ovpn"
    flat: yes

- name: Display client config location
  debug:
    msg:
      - "Client '{{ openvpn_client_name }}' created successfully!"
      - "Config file: {{ openvpn_local_clients_dir }}/{{ openvpn_client_name }}/{{ openvpn_client_name }}.ovpn"
      - "Import this file into your OpenVPN client application."
